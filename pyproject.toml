[project]
name = "wht-determination-engine"
version = "0.2.0"
description = "Deterministic WHT determination rules engine (demo)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["wht_engine*", "adapters*"]

[tool.setuptools.package-data]
wht_engine = ["data/*.csv"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

